<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <!-- Start with the code from the HTML folder.
      - Make sure to fix any issues in your HTML code.
      - Delete all mentions of <br>s and style the line breaks with CSS. 
      - Add classes to style the elements on the page. -->
     <body class="form-page"></body>
     <form class="ira-calculator">
        <h2>Roth IRA Calculator</h2>
        
        <div class="form-row">
          <label for="balance">Balance ($)</label>
          <input type="text" id="balance" name="balance">
        </div>

        <div class="form-row">
          <label for="annual-contrib">Annual contribution ($)</label>
          <input type="text" id="annual-contrib" name="annual-contrib">
        </div>

        <div class="form-radio-group">
          <p class="radio-label">Maximize contribution?</p>
          <div class="radio-options">
            <input type="radio" id="yes" name="maximize" value="yes">
            <label for="yes">Yes</label>
            
            <input type="radio" id="no" name="maximize" value="no">
            <label for="no">No</label>
          </div>
        </div>

        <div class="form-row">
          <label for="return-rate">Expected rate of return (%)</label>
          <input type="number" id="return-rate" name="return-rate">
        </div>

        <div class="form-row">
          <label for="current-age">Current age</label>
          <input type="number" id="current-age" name="current-age">
        </div>

        <div class="form-row">
          <label for="retire-age">Retirement age</label>
          <input type="number" id="retire-age" name="retire-age">
        </div>

        <div class="form-row">
          <label for="tax-rate">Marginal tax rate (%)</label>
          <input type="number" id="tax-rate" name="tax-rate">
        </div>

        <div class="button-group">
          <button type="submit" class="btn-calc">Calculate</button>
          <button type="reset" class="btn-reset">Reset</button>
        </div>

        <p class="disclaimer">
          This exercise is a simplified version of the Roth IRA Calculator at <a href="#">Calculator.net</a>
        </p>
      </form>
    </main>
  </body>
</html>
